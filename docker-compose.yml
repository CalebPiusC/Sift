services:
  postgres:
    image: postgres:17-alpine
    command:
      [
        'postgres',
        '-c',
        'log_statement=none',
        '-c',
        'log_min_error_statement=panic',
        '-c',
        'log_parameter_max_length_on_error=0',
      ]
    environment:
      POSTGRES_DB: selvora
      POSTGRES_USER: selvora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tests/bootstrap.sql:/docker-entrypoint-initdb.d/001-auth.sql:ro
      - ./supabase/migrations/202611100001_foundation.sql:/docker-entrypoint-initdb.d/002-foundation.sql:ro
      - ./supabase/migrations/202611100002_receipt_privileges.sql:/docker-entrypoint-initdb.d/003-receipt-privileges.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U selvora']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
